<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <!-- Linha de inclusão do Tailwind CSS via CDN v4.0 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-50 min-h-screen font-sans antialiased flex flex-col
justify-between">
    <header class="bg-slate-900 text-white py-5 shadow-sm text-center">
        <h1 class="text-xl font-bold tracking-wider" id="titulo-principal">Gerenciador de
            Tarefas</h1>
    </header>
    <main class="flex-1 w-full max-w-6xl mx-auto p-4 md:p-6 lg:p-8 grid grid-cols-1
md:grid-cols-2 gap-6 items-start">
        <!-- Seção de Acesso ao Sistema -->
        <section id="secao-login" class="w-full bg-white rounded-xl border border-slate-200
shadow-md p-6 flex flex-col gap-4">



            <h2 class="text-lg font-bold text-center text-slate-900">Acesso ao Sistema</h2>
            <form class="flex flex-col gap-4">
                <div class="flex flex-col gap-1">

                    <label class="text-xs font-bold text-slate-600 uppercase

tracking-wider">Usuário:</label>

                    <input type="text" required placeholder="Digite seu usuário" class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 px-3

text-sm focus:outline-none">
                </div>
                <div class="flex flex-col gap-1">

                    <label class="text-xs font-bold text-slate-600 uppercase

tracking-wider">Senha:</label>

                    <input type="password" required placeholder="Digite sua senha" class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 px-3

text-sm focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium

text-sm py-2.5 rounded-lg transition-colors shadow-sm">

                    Entrar
                </button>
            </form>
        </section>
        <!-- Seção do Formulário de Cadastro -->
        <section class="w-full bg-white rounded-xl border border-slate-200 shadow-sm p-6" id="secao-cadastro">

            <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b

border-slate-100">Criar Nova Tarefa</h2>
            <form class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-1 md:col-span-2">
                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider" for="input-titulo">Título
                        da Atividade:</label>

                    <input class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2 px-3
text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/20
focus:border-emerald-500" type="text" id="input-titulo" required placeholder="Digite o nome da

atividade...">
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-bold text-slate-600 uppercase tracking-wider"
                        for="select-prioridade">Prioridade:</label>

                    <select class="w-full bg-slate-50 border border-slate-200 rounded-lg py-2

px-3 text-sm focus:outline-none" id="select-prioridade" name="priority">
                        <option value="low">Baixa</option>
                        <option value="medium" selected>Média</option>
                        <option value="high">Alta</option>


                    </select>
                </div>
                <button class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium

text-sm py-2.5 rounded-lg transition-colors shadow-sm md:mt-5" id="btn-cadastrar" type="submit">Cadastrar</button>
            </form>
        </section>
        <!-- Seção da Lista de Tarefas (Protótipo Estático) -->
        <section class="w-full md:col-span-2 mt-4" id="secao-lista">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Minhas Tarefas</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="tasks-list">
                <article class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex
items-start gap-4">

                    <input class="mt-1 accent-emerald-500" type="checkbox">
                    <div class="flex-1">
                        <h4 class="text-sm font-bold text-slate-900">Estudar para a Prova de

                            Web</h4>

                        <p class="text-xs text-slate-500 mt-1">Revisar conceitos teóricos de

                            HTTP.</p>
                    </div>
                    <span class="text-xs px-2 py-0.5 rounded-full bg-rose-50 border

border-rose-200 text-rose-700 font-semibold">Alta</span>
                </article>
                <article class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex
items-start gap-4">

                    <input type="checkbox" class="mt-1 accent-emerald-500">
                    <div class="flex-1">
                        <h4 class="text-sm font-bold text-slate-900">Configurar Repositório

                            Git</h4>

                        <p class="text-xs text-slate-500 mt-1">Realizar o push das atualizações

                            visuais.</p>
                    </div>
                    <span class="text-xs px-2 py-0.5 rounded-full bg-amber-50 border

border-amber-200 text-amber-700 font-semibold">Média</span>
                </article>
            </div>
        </section>
    </main>
    <footer class="bg-slate-100 text-center py-4 text-xs text-slate-500 border-t
border-slate-200">
        <p>Desenvolvimento de Sistemas Web - 2026</p>
