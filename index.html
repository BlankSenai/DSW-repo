<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSW Aula 1</title>
</head>

<body>
    <header>
        <h1>Gerenciador de Tarefas</h1>
    </header>

    <main>
        <section>
            <h2>Nova Tarefa</h2>

            <form>
                <div>
                    <label for="input-tarefa">Nome:</label>
                    <input type="text" id="input-tarefa" name="input-tarefa" required placeholder="Nome da tarefa">
                </div>

                <div>
                    <label for="select-prioridade">Prioridade:</label>

                    <select id="select-prioridade" name="select-prioridade">
                        <option value="baixa">Baixa</option>
                        <option value="media">Média</option>
                        <option value="alta">Alta</option>
                    </select>
                </div>

                <button type="submit">Enviar Tarefa</button>
            </form>
        </section>

        <section>
            <h2>Tarefas Cadastradas</h2>

            <div>
                <input type="checkbox">
                <h4>Pegar xababas</h4>
            </div>
        </section>
    </main>

    <footer>
        <p>Desenvolvimento de Sistemas Web - 2026</p>
    </footer>
</body>

</html>
